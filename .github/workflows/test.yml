name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.4 is the Ruby 3.x line in the README; 4.0 is what local Homebrew installs.
        ruby: ["3.4", "4.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Media budget
        run: ruby scripts/check_media_budget.rb
      - name: Tests
        run: bundle exec rake test
