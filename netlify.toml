[build]
  command = "ruby scripts/check_media_budget.rb && bundle exec jekyll build"
  publish = "_site"

[build.environment]
  JEKYLL_ENV = "production"
  OPENSX70_USE_NETLIFY_IMAGE_CDN = "true"
  # The :test group (minitest, rake) is only needed in CI.
  BUNDLE_WITHOUT = "test"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/assets/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"
