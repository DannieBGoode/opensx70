[build]
  command = "ruby scripts/check_media_budget.rb && bundle exec jekyll build"
  publish = "_site"

[build.environment]
  JEKYLL_ENV = "production"
  OPENSX70_USE_NETLIFY_IMAGE_CDN = "true"
  # The :test group (minitest, rake) is only needed in CI.
  BUNDLE_WITHOUT = "test"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/assets/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# Vendor scripts and fonts never change in place; main.css is cache-busted per
# build. main.js and calculator.js keep Netlify's revalidate-every-time default.
[[headers]]
  for = "/js/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"
